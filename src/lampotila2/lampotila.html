<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="../style.css">
    <title>lämpötilamuunna</title>
</head>
<body >
<form action="" method="POST">
    <header>LÄMPÖTILA MUUNNOS</header>
    <br>
    <div class="yksikko">
        <label for="mist">Mistä</label>
        <select name="mist" id="mist">
            <option value="c" selected>Celcius</option>
            <option value="f">Ferenheit</option>
            <option value="k">Kelvin</option>
        </select>
    </div>
    <div class="yksikko">
        <label for="minn">Minne</label>
        <select name="minn" id="minn">
            <option value="c">Celcius</option>
            <option value="f">Ferenheit</option>
            <option value="k" selected>Kelvin</option>
        </select>
    </div>
        <br>

        <label for="luku">Syötä luku</label>
        <input type="number" id="luku" value="">
        <br><br>

    <div class="btn">
        <button type="submit" value="Muunna">Laskee</button>
        <button type="reset">reset</button>
    </div>
</form>
</body>
</html>
